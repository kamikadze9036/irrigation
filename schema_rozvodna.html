<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Schéma rozvaděče — Zavlažovací systém</title>
<style>
  body { background:#0d1117; margin:0; padding:20px; font-family:'Courier New',monospace; }
  svg { max-width:100%; height:auto; display:block; margin:0 auto; }
</style>
</head>
<body>
<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrowL"  markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f5a623"/></marker>
    <marker id="arrowAC" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/></marker>
    <marker id="arrowAC2"markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fb923c"/></marker>
    <marker id="arrowDC" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ade80"/></marker>
  </defs>

  <!-- ══════════════════════════════════════════════════
       TITLE
  ══════════════════════════════════════════════════ -->
  <text x="450" y="20" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="Courier New">SCHÉMA ROZVADĚČE — ZAVLAŽOVACÍ SYSTÉM</text>
  <text x="450" y="36" text-anchor="middle" fill="#555" font-size="10" font-family="Courier New">ESP32-WROOM + 8× relé Active HIGH | 24V AC ventily + 12V DC řídicí systém</text>

  <!-- ══════════════════════════════════════════════════
       WIRES (drawn first, behind boxes)

       Color key:
         L fáze  = #f5a623
         N nula  = #60a5fa
         24V pólA= #f87171
         24V pólB= #fb923c
         12V DC  = #4ade80
  ══════════════════════════════════════════════════ -->

  <!-- L: input dot → split junction (100,85) -->
  <line x1="30" y1="85" x2="100" y2="85" stroke="#f5a623" stroke-width="2.5"/>

  <!-- L: junction → MCB1 left -->
  <line x1="100" y1="85" x2="115" y2="85" stroke="#f5a623" stroke-width="2.5"/>

  <!-- L: junction → down → MCB2 left -->
  <polyline points="100,85 100,200 115,200" stroke="#f5a623" stroke-width="2.5" fill="none"/>

  <!-- L: MCB1 right → Trafo24 primary L -->
  <line x1="175" y1="85" x2="205" y2="85" stroke="#f5a623" stroke-width="2.5"/>

  <!-- L: MCB2 right → Src12 primary L -->
  <line x1="175" y1="200" x2="205" y2="200" stroke="#f5a623" stroke-width="2.5"/>

  <!-- N: N-bus right → horizontal → junction dot (260,310) -->
  <line x1="75" y1="310" x2="265" y2="310" stroke="#60a5fa" stroke-width="2.5"/>
  <!-- N: up at x=260 → Trafo24 bottom N (260,146) and Src12 bottom N (260,246) -->
  <line x1="260" y1="146" x2="260" y2="310" stroke="#60a5fa" stroke-width="2.5"/>
  <!-- N: branch right to Trafo24 bottom center -->
  <line x1="260" y1="146" x2="258" y2="146" stroke="#60a5fa" stroke-width="2.5"/>
  <!-- N: branch right to Src12 bottom center -->
  <line x1="260" y1="246" x2="258" y2="246" stroke="#60a5fa" stroke-width="2.5"/>

  <!-- 24V pólA: Trafo24 right (317,78) → Svorky left (355,78) -->
  <line x1="317" y1="78" x2="355" y2="78" stroke="#f87171" stroke-width="2.5"/>

  <!-- 24V pólB: Trafo24 right (317,118) → down (317,380) → right → exit (875,380) -->
  <polyline points="317,118 317,380 875,380" stroke="#fb923c" stroke-width="2.5" fill="none" marker-end="url(#arrowAC2)"/>

  <!-- 12V DC: Src12 right (317,215) → right → up → ESP32 top left area -->
  <polyline points="317,215 400,215 400,100 445,100" stroke="#4ade80" stroke-width="2.5" fill="none"/>

  <!-- Svorky right → 4× COM wires into Relay left edge -->
  <line x1="440" y1="105" x2="445" y2="105" stroke="#f87171" stroke-width="2"/>
  <line x1="440" y1="120" x2="445" y2="120" stroke="#f87171" stroke-width="2"/>
  <line x1="440" y1="135" x2="445" y2="135" stroke="#f87171" stroke-width="2"/>
  <line x1="440" y1="150" x2="445" y2="150" stroke="#f87171" stroke-width="2"/>

  <!-- Fan from Svorky right (440,78) down to COM inputs -->
  <polyline points="440,78 440,105" stroke="#f87171" stroke-width="1.5" fill="none"/>
  <polyline points="440,78 440,105" stroke="#f87171" stroke-width="1.5" fill="none"/>
  <line x1="355" y1="78" x2="440" y2="78" stroke="#f87171" stroke-width="2"/>
  <polyline points="440,78 440,150" stroke="#f87171" stroke-width="1" stroke-dasharray="3,2" fill="none"/>

  <!-- NO outputs from Relay right edge → ventily labels -->
  <line x1="655" y1="110" x2="695" y2="110" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowAC2)"/>
  <line x1="655" y1="130" x2="695" y2="130" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowAC2)"/>
  <line x1="655" y1="150" x2="695" y2="150" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowAC2)"/>
  <line x1="655" y1="170" x2="695" y2="170" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowAC2)"/>
  <line x1="655" y1="190" x2="695" y2="190" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowAC2)"/>

  <!-- ══════════════════════════════════════════════════
       JUNCTION DOTS
  ══════════════════════════════════════════════════ -->
  <circle cx="100" cy="85"  r="4.5" fill="#f5a623"/>   <!-- L split -->
  <circle cx="260" cy="246" r="4.5" fill="#60a5fa"/>   <!-- N split at Src12 -->
  <circle cx="260" cy="310" r="4.5" fill="#60a5fa"/>   <!-- N bus junction -->
  <circle cx="440" cy="78"  r="4.5" fill="#f87171"/>   <!-- pólA fan split -->

  <!-- ══════════════════════════════════════════════════
       BOXES
  ══════════════════════════════════════════════════ -->

  <!-- L input terminal -->
  <circle cx="22" cy="85" r="8" fill="#1a1000" stroke="#f5a623" stroke-width="1.5"/>
  <text x="22" y="89" text-anchor="middle" fill="#f5a623" font-size="9" font-family="Courier New" font-weight="bold">L</text>

  <!-- N bus -->
  <rect x="20" y="298" width="55" height="24" rx="3" fill="#0a1f3a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="47" y="313" text-anchor="middle" fill="#60a5fa" font-size="9" font-family="Courier New">N můstek</text>

  <!-- MCB1 -->
  <rect x="115" y="65" width="60" height="40" rx="4" fill="#1a2f5a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="145" y="81"  text-anchor="middle" fill="#4a90d9" font-size="11" font-family="Courier New" font-weight="bold">MCB1</text>
  <text x="145" y="97"  text-anchor="middle" fill="#8ab4f8" font-size="10" font-family="Courier New">6A  24V</text>

  <!-- MCB2 -->
  <rect x="115" y="180" width="60" height="40" rx="4" fill="#1a2f5a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="145" y="196" text-anchor="middle" fill="#4a90d9" font-size="11" font-family="Courier New" font-weight="bold">MCB2</text>
  <text x="145" y="212" text-anchor="middle" fill="#8ab4f8" font-size="10" font-family="Courier New">6A  12V</text>

  <!-- TRAFO 24V AC -->
  <rect x="205" y="48" width="112" height="98" rx="5" fill="#0f2a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="261" y="68"  text-anchor="middle" fill="#4ade80" font-size="10" font-family="Courier New" font-weight="bold">TRAFO</text>
  <text x="261" y="82"  text-anchor="middle" fill="#4ade80" font-size="12" font-family="Courier New" font-weight="bold">24V AC</text>
  <text x="261" y="96"  text-anchor="middle" fill="#666"    font-size="9"  font-family="Courier New">prim: 230V AC</text>
  <text x="261" y="108" text-anchor="middle" fill="#f87171" font-size="9"  font-family="Courier New">sek A: 24V →</text>
  <text x="261" y="120" text-anchor="middle" fill="#fb923c" font-size="9"  font-family="Courier New">sek B: 24V →</text>
  <!-- Terminal marks on box edges -->
  <line x1="205" y1="85"  x2="210" y2="85"  stroke="#f5a623" stroke-width="2"/>
  <line x1="317" y1="78"  x2="312" y2="78"  stroke="#f87171" stroke-width="2"/>
  <line x1="317" y1="118" x2="312" y2="118" stroke="#fb923c" stroke-width="2"/>
  <line x1="258" y1="146" x2="258" y2="141" stroke="#60a5fa" stroke-width="2"/>

  <!-- ZDROJ 12V DC -->
  <rect x="205" y="183" width="112" height="63" rx="5" fill="#0f2a1a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="261" y="203" text-anchor="middle" fill="#4ade80" font-size="10" font-family="Courier New" font-weight="bold">ZDROJ</text>
  <text x="261" y="217" text-anchor="middle" fill="#4ade80" font-size="12" font-family="Courier New" font-weight="bold">12V DC</text>
  <text x="261" y="231" text-anchor="middle" fill="#666"    font-size="9"  font-family="Courier New">prim: 230V AC</text>
  <!-- Terminal marks -->
  <line x1="205" y1="200" x2="210" y2="200" stroke="#f5a623" stroke-width="2"/>
  <line x1="317" y1="215" x2="312" y2="215" stroke="#4ade80" stroke-width="2"/>
  <line x1="258" y1="246" x2="258" y2="241" stroke="#60a5fa" stroke-width="2"/>

  <!-- Svorkovnice 24V pólA -->
  <rect x="355" y="60" width="85" height="36" rx="3" fill="#1a1500" stroke="#f87171" stroke-width="1.5"/>
  <text x="397" y="76"  text-anchor="middle" fill="#f87171" font-size="10" font-family="Courier New" font-weight="bold">SVORKY</text>
  <text x="397" y="89"  text-anchor="middle" fill="#c04040" font-size="9"  font-family="Courier New">24V AC pól A</text>

  <!-- ESP32 + 8× Relé (big combined box) -->
  <rect x="445" y="52" width="210" height="290" rx="6" fill="#1e0f3a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="550" y="73" text-anchor="middle" fill="#c084fc" font-size="11" font-family="Courier New" font-weight="bold">ESP32 + 8× RELÉ</text>
  <text x="550" y="87" text-anchor="middle" fill="#7c3aed" font-size="9"  font-family="Courier New">Active HIGH | VIN: 12V DC</text>

  <!-- ESP32 sub-box -->
  <rect x="455" y="200" width="190" height="130" rx="4" fill="#150a2a" stroke="#4c1d95" stroke-width="1"/>
  <text x="550" y="217" text-anchor="middle" fill="#e9d5ff" font-size="10" font-family="Courier New" font-weight="bold">ESP32-WROOM</text>
  <text x="550" y="231" text-anchor="middle" fill="#a78bfa" font-size="9"  font-family="Courier New">GPIO 13,12,14,27,26,25,33,32</text>
  <text x="550" y="245" text-anchor="middle" fill="#a78bfa" font-size="9"  font-family="Courier New">WiFi STA/AP · WebServer :80</text>
  <text x="550" y="259" text-anchor="middle" fill="#a78bfa" font-size="9"  font-family="Courier New">Scheduler · NVS · NTP · mDNS</text>
  <text x="550" y="273" text-anchor="middle" fill="#7c3aed" font-size="9"  font-family="Courier New">Core0: WebServer</text>
  <text x="550" y="287" text-anchor="middle" fill="#7c3aed" font-size="9"  font-family="Courier New">Core1: main loop</text>
  <text x="550" y="303" text-anchor="middle" fill="#4c1d95" font-size="9"  font-family="Courier New">irrigation.local</text>
  <text x="550" y="321" text-anchor="middle" fill="#6d28d9" font-size="9"  font-family="Courier New">Telegram Bot (plánováno)</text>

  <!-- Relay rows inside relay section -->
  <text x="455" y="107" fill="#c084fc" font-size="9" font-family="Courier New" x="465"> COM→NO  Relé 1 (GPIO13) Z1</text>
  <text x="455" y="122" fill="#c084fc" font-size="9" font-family="Courier New" x="465"> COM→NO  Relé 2 (GPIO12) Z2</text>
  <text x="455" y="137" fill="#c084fc" font-size="9" font-family="Courier New" x="465"> COM→NO  Relé 3 (GPIO14) Z3</text>
  <text x="455" y="152" fill="#c084fc" font-size="9" font-family="Courier New" x="465"> COM→NO  Relé 4 (GPIO27) Z4</text>
  <text x="455" y="167" fill="#c084fc" font-size="9" font-family="Courier New" x="465"> COM→NO  Relé 5-7 + rez.</text>

  <!-- 12V input label inside box -->
  <text x="490" y="97" fill="#4ade80" font-size="9" font-family="Courier New">← 12V DC (VIN)</text>

  <!-- Output labels (right of relay box) -->
  <text x="700" y="114" fill="#fb923c" font-size="10" font-family="Courier New">→ Ventil Z1</text>
  <text x="700" y="134" fill="#fb923c" font-size="10" font-family="Courier New">→ Ventil Z2</text>
  <text x="700" y="154" fill="#fb923c" font-size="10" font-family="Courier New">→ Ventil Z3</text>
  <text x="700" y="174" fill="#fb923c" font-size="10" font-family="Courier New">→ Ventil Z4–Z6</text>
  <text x="700" y="194" fill="#fb923c" font-size="10" font-family="Courier New">→ Master ventil</text>
  <text x="700" y="210" fill="#555"    font-size="9"  font-family="Courier New">  (NO výstup 24V AC)</text>

  <!-- pólB label at bottom -->
  <text x="350" y="375" fill="#fb923c" font-size="10" font-family="Courier New">24V AC pól B (nula ventilů) → přímo ven z rozvaděče →</text>

  <!-- ══════════════════════════════════════════════════
       PANEL BORDER
  ══════════════════════════════════════════════════ -->
  <rect x="10" y="44" width="840" height="360" rx="8" fill="none" stroke="#2d3748" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="14" y="42" fill="#374151" font-size="10" font-family="Courier New">ROZVADĚČ</text>

  <!-- ══════════════════════════════════════════════════
       LEGEND
  ══════════════════════════════════════════════════ -->
  <rect x="10" y="408" width="860" height="18" rx="3" fill="#0a0f1a"/>
  <line x1="16" y1="417" x2="46" y2="417" stroke="#f5a623" stroke-width="2.5"/>
  <text x="50" y="420" fill="#f5a623" font-size="9" font-family="Courier New">L fáze 230V</text>
  <line x1="140" y1="417" x2="170" y2="417" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="174" y="420" fill="#60a5fa" font-size="9" font-family="Courier New">N nula 230V</text>
  <line x1="268" y1="417" x2="298" y2="417" stroke="#f87171" stroke-width="2.5"/>
  <text x="302" y="420" fill="#f87171" font-size="9" font-family="Courier New">24V AC pól A (spínaný)</text>
  <line x1="462" y1="417" x2="492" y2="417" stroke="#fb923c" stroke-width="2.5"/>
  <text x="496" y="420" fill="#fb923c" font-size="9" font-family="Courier New">24V AC pól B (přímý)</text>
  <line x1="650" y1="417" x2="680" y2="417" stroke="#4ade80" stroke-width="2.5"/>
  <text x="684" y="420" fill="#4ade80" font-size="9" font-family="Courier New">12V DC (ESP32)</text>

</svg>
</body>
</html>
